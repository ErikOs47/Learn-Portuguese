 if(e.k==="p")h+='<div class="big">🎧 Mini-Podcast</div><div class="mut">Zwei Sprecher, eine kurze Folge. Nur zuhören!</div><button class="btn p" id="pl">▶ Folge abspielen</button><button class="btn" id="sl">🐢 Langsam</button>';
 if(e.k==="l")h+='<div class="mut">Was bedeutet das?</div><button class="btn p" id="pl">🔊 Abspielen</button><button class="btn" id="sl">🐢 Langsam</button><div id="op"></div>';
 if(e.k==="r")h+='<p>'+e.x+'</p><button class="btn" id="pl">🔊 Vorlesen</button><div class="mut">'+e.q+'</div><div id="op"></div>';
 if(e.k==="w")h+='<div class="mut">Schreibe auf Portugiesisch:</div><div class="big">'+e.q+'</div><input id="in" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="btn p" id="ck">Prüfen</button>';
 h+='<div class="fb" id="fb"></div></div><div id="nx"></div>';
 A.innerHTML=h;
 document.getElementById("bk").onclick=home;
 var pl=document.getElementById("pl");if(pl)pl.onclick=function(){if(e.k==="r")say(e.x);else if(e.k==="p"||e.k==="q")pod();else say(e.s||e.p)};
 if(e.k==="p"){document.getElementById("sl").onclick=function(){pod(1)};next()}
 if(e.k==="l"){say(e.p);document.getElementById("sl").onclick=function(){say(e.p,1)}}
 if(e.k==="c"){var rv=document.getElementById("rv");rv.innerHTML='<button class="btn p" id="sh">Übersetzung zeigen</button>';document.getElementById("sh").onclick=function(){rv.innerHTML='<div class="big" style="color:var(--ac)">'+e.d+'</div>';next()};say(e.s||e.p)}
 if(e.o){var op=document.getElementById("op");tot++;
  shuf(e.o).forEach(function(x){var b=document.createElement("button");b.className="btn";b.textContent=x.v;b.onclick=function(){
   var right=x.i===e.a;if(right)sc++;
   Array.prototype.forEach.call(op.children,function(c){c.disabled=true});b.classList.add(right?"ok":"no");
   if(!right)Array.prototype.forEach.call(op.children,function(c){if(c.textContent===e.o[e.a])c.classList.add("ok")});
   fb(right,e.n);next()};op.appendChild(b)})}
 if(e.k==="w"){tot++;var inp=document.getElementById("in");document.getElementById("ck").onclick=function(){
  var right=e.a.indexOf(norm(inp.value))>=0;if(right)sc++;inp.disabled=true;this.hidden=true;fb(right,e.n);next()}}
}
function fb(r,n){var f=document.getElementById("fb");f.textContent=(r?"✓ Richtig. ":"✗ Nicht ganz. ")+(n||"");f.style.color=r?"var(--ok)":"var(--bad)"}
function next(){mark();var n=document.getElementById("nx");n.innerHTML='<button class="btn p" id="go">Weiter</button>';document.getElementById("go").onclick=function(){ei++;step()}}
function fin(){var p=tot?Math.round(sc/tot*100):100;if(P[li]==null||p>P[li])P[li]=p;enroll();save();
 A.innerHTML='<div class="card"><div class="big">Lektion geschafft 🎉</div><p style="text-align:center">'+sc+' von '+tot+' richtig ('+p+' %)</p><button class="btn p" id="hm">Zur Übersicht</button><button class="btn" id="rp">Nochmal üben</button><button class="btn" id="ow">Übersicht ansehen</button></div>';
 document.getElementById("hm").onclick=home;document.getElementById("ow").onclick=function(){ovw(0)};
 if(LS[li].pod){var d=document.createElement("div");d.className="card";d.innerHTML="<div class=tag>Transkript</div>"+LS[li].pod.map(function(t){return"<p>"+t[0]+"<br><span class=mut>"+t[1]+"</span></p>"}).join("");A.appendChild(d)}document.getElementById("rp").onclick=function(){ei=0;sc=0;tot=0;step()}}
function ovw(m){A.innerHTML='<button class="back" id="bk">‹ Lektionen</button><h1>'+LS[li].t+'</h1><div class="mut">Das lernst du in dieser Lektion</div>'+LS[li].ov+'<button class="btn p" id="go">'+(m?'Los geht’s':'Zurück')+'</button>';document.getElementById("bk").onclick=home;document.getElementById("go").onclick=m?step:home}
function ymd(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function mark(){var t=ymd(new Date());P.days=P.days||[];if(P.days[P.days.length-1]!==t)P.days.push(t);P.days=P.days.slice(-200);save()}
function streak(){var s={},n=0,d=new Date();(P.days||[]).forEach(function(x){s[x]=1});if(!s[ymd(d)])d.setDate(d.getDate()-1);while(s[ymd(d)]){n++;d.setDate(d.getDate()-1)}return n}
function lvs(v){var t=LS.filter(function(l){return l.lv===v});return[t.length,t.filter(function(l){return P[LS.indexOf(l)]!=null}).length]}
function stats(){var V=["A1","A2","B1","B2","C1"],sr=P.srs||{},ks=Object.keys(sr),f=ks.filter(function(k){return sr[k].iv>=7}).length,dn=LS.filter(function(l,i){return P[i]!=null}).length,cd=V.filter(function(v){var r=lvs(v);return r[0]&&r[0]===r[1]}).length;
 var h='<div class="st"><div><b>🔥 '+streak()+'</b><span class="mut">Tage am Stück</span></div><div><b>'+ks.length+'</b><span class="mut">Wörter ('+f+' gefestigt)</span></div><div><b>'+Math.round(dn/LS.length*100)+' %</b><span class="mut">'+dn+' von '+LS.length+' Lektionen</span></div></div><div class="dy">';
 var d=new Date(),s={},a=[];(P.days||[]).forEach(function(x){s[x]=1});for(var i=0;i<14;i++){a.unshift('<i class="'+(s[ymd(d)]?'on':'')+'"></i>');d.setDate(d.getDate()-1)}
 h+=a.join("")+'</div><div class="mut" style="margin:4px 0 10px">Letzte 14 Tage · Kapitel abgeschlossen: '+cd+'/5</div>';
 V.forEach(function(v){var r=lvs(v);h+='<div class="row mut"><span>'+v+'</span><span>'+(r[0]?r[1]+'/'+r[0]+' Lektionen':'in Planung')+'</span></div><div class="bar"><i style="width:'+(r[0]?Math.round(r[1]/r[0]*100):0)+'%"></i></div>'});
 return h}
function pod(slow){try{speechSynthesis.cancel();var v=speechSynthesis.getVoices().filter(function(x){return x.lang.replace("_","-")==="pt-PT"})[0];LS[li].pod.forEach(function(t,i){var u=new SpeechSynthesisUtterance(t[0]);u.lang="pt-PT";if(v)u.voice=v;u.rate=slow?0.6:0.85;u.pitch=i%2?0.85:1.2;speechSynthesis.speak(u)})}catch(e){}}
function enroll(){P.srs=P.srs||{};LS[li].ex.forEach(function(e){if(e.k==="c"&&!P.srs[e.p])P.srs[e.p]={d:e.d,s:e.s,ease:2.5,iv:0,due:0,n:0}})}
function due(){var n=Date.now(),s=P.srs||{};return Object.keys(s).filter(function(k){return s[k].due<=n}).sort(function(a,b){return s[a].due-s[b].due})}
function calc(c,g){var e=c.ease,v=c.iv;if(g===0)return{ease:Math.max(1.3,e-.2),iv:0,m:1};if(v===0)v=g===1?1:g===2?2:4;else{v=g===1?v*1.2:g===2?v*e:v*e*1.3;e+=g===3?.15:g===1?-.15:0}return{ease:Math.max(1.3,e),iv:Math.max(1,Math.round(v)),m:0}}
function rev(){var q=due(),h='<button class="back" id="bk">‹ Lektionen</button>';
 if(!q.length){A.innerHTML=h+'<div class="card"><div class="big">Alles wiederholt 🎉</div><p class="mut" style="text-align:center">Aktuell ist keine Karte fällig.</p></div>';document.getElementById("bk").onclick=home;return}
 var k=q[0],c=P.srs[k];
 A.innerHTML=h+'<div class="card"><div class="tag">Wiederholung · '+q.length+' fällig</div><div class="big">'+k+'</div><button class="btn" id="pl">🔊 Anhören</button><div id="rv"></div></div>';
 document.getElementById("bk").onclick=home;document.getElementById("pl").onclick=function(){say(c.s||k)};say(c.s||k);
 var rv=document.getElementById("rv");rv.innerHTML='<button class="btn p" id="sh">Übersetzung zeigen</button>';
 document.getElementById("sh").onclick=function(){var L=["Nochmal","Schwer","Gut","Leicht"];
  rv.innerHTML='<div class="big" style="color:var(--ac)">'+c.d+'</div>'+L.map(function(x,g){var r=calc(c,g);return'<button class="btn" data-g="'+g+'">'+x+' <span class="mut">· '+(r.m?'1 Min.':r.iv+' T.')+'</span></button>'}).join("");
  Array.prototype.forEach.call(rv.querySelectorAll("[data-g]"),function(b){b.onclick=function(){var r=calc(c,+b.dataset.g);c.ease=r.ease;c.iv=r.iv;c.n++;c.due=Date.now()+(r.m?60000:r.iv*86400000);mark();rev()}})}}
try{navigator.storage.persist()}catch(e){}
try{speechSynthesis.getVoices()}catch(e){}
home();
</script>
