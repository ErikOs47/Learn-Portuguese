.tile:active,.dc:active,.lr:active,.wr:active{transform:scale(.97)}

.dc{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;font:inherit;color:var(--tx);cursor:pointer}

.dc.full .rg{background:linear-gradient(135deg,var(--ac),var(--ac2))}.dc.full .rg span{background:transparent;color:#fff}

.dc.fu{opacity:.4}
.lr{display:block;width:100%;border:0;background:none;padding:10px 0 4px;font:inherit;color:var(--tx);text-align:left;cursor:pointer}
.lr .bar{margin-top:6px}
.fx{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}

.cd{aspect-ratio:1;border:0;border-radius:50%;background:none;font:inherit;font-size:15px;color:var(--tx);display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}

{lv:"A2",t:"Reflexivverben",ov:"<table><tr><th></th><th>levantar-se</th><th>Pronomen</th></tr><tr><td>eu</td><td>levanto-me</td><td>me</td></tr><tr><td>tu</td><td>levantas-te</td><td>te</td></tr><tr><td>ele / ela / você</td><td>levanta-se</td><td>se</td></tr><tr><td>nós</td><td>levantamo-nos</td><td>nos</td></tr><tr><td>eles / elas / vocês</td><td>levantam-se</td><td>se</td></tr></table><div class=nt>In Portugal steht das Pronomen normalerweise nach dem Verb, mit Bindestrich: „Levanto-me às sete.“ Nach „não“, „já“, „também“, „sempre“ und „que“ steht es davor: „Não me levanto cedo.“ Wichtige Verben: chamar-se (heißen), levantar-se (aufstehen), deitar-se (ins Bett gehen), sentar-se (sich setzen), lavar-se (sich waschen). „Como te chamas?“ – „Chamo-me Pedro.“</div>",ex:[

{lv:"A2",t:"Pretérito Imperfeito",ov:"<table><tr><th></th><th>falar</th><th>comer / partir</th><th>ser</th><th>ter</th></tr><tr><td>eu</td><td>falava</td><td>comia</td><td>era</td><td>tinha</td></tr><tr><td>tu</td><td>falavas</td><td>comias</td><td>eras</td><td>tinhas</td></tr><tr><td>ele / ela</td><td>falava</td><td>comia</td><td>era</td><td>tinha</td></tr><tr><td>nós</td><td>falávamos</td><td>comíamos</td><td>éramos</td><td>tínhamos</td></tr><tr><td>eles / elas</td><td>falavam</td><td>comiam</td><td>eram</td><td>tinham</td></tr></table><div class=nt>Das Imperfeito beschreibt Gewohnheiten, Zustände und Hintergründe in der Vergangenheit: „Quando era criança, vivia no Porto.“ Das Perfeito dagegen nennt ein einzelnes, abgeschlossenes Ereignis: „Ontem fui à praia.“ Signalwörter für das Imperfeito: antigamente, sempre, todos os dias, quando era criança. Weitere Formen: ir → ia, estar → estava, ver → via, vir → vinha.</div>",ex:[
